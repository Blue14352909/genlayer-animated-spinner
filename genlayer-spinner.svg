<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Central consensus structure: flat-top hexagon -->
  <polygon points="50,45 54.33,47.5 54.33,52.5 50,55 45.67,52.5 45.67,47.5"
           fill="none" stroke="#7C3AED" stroke-width="2" opacity=".45"/>

  <!-- Outer validator: purple, CW 4s, r 34→14→34, starts at 0° -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
    <circle cx="50" cy="50" r="5" fill="#7C3AED">
      <animate attributeName="cx" values="84;64;84" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;50;50" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#7C3AED"
      stroke-width="1.5" stroke-linecap="round"
      stroke-dasharray="53 160" stroke-dashoffset="53" opacity=".15">
      <animate attributeName="r" values="34;14;34" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Middle validator: violet, CW 5s, r 23→14→23, starts at 120° -->
  <g transform="rotate(120 50 50)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 50 50" to="360 50 50" dur="5s" repeatCount="indefinite"/>
      <circle cx="50" cy="50" r="4.5" fill="#A855F7">
        <animate attributeName="cx" values="73;64;73" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="50;50;50" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="23" fill="none" stroke="#A855F7"
        stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="48 96" opacity=".12">
        <animate attributeName="r" values="23;14;23" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Inner validator: orange, CW 4s, r 14→10→14, starts at 240° -->
  <g transform="rotate(240 50 50)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
      <circle cx="50" cy="50" r="3.5" fill="#F97316">
        <animate attributeName="cx" values="64;60;64" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="50;50;50" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="14" fill="none" stroke="#F97316"
        stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="34 54" stroke-dashoffset="34" opacity=".1">
        <animate attributeName="r" values="14;10;14" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
